<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGarage - Assistant Mécanique</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 20px;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #1e40af;
            color: white;
            padding: 20px;
            text-align: center;
        }
        #chat {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #fafcff;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 75%;
        }
        .user {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot {
            background: #e2e8f0;
            color: #1f2937;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 15px;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
        }
        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
        }
        button {
            margin-left: 10px;
            padding: 0 25px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>🛠️ SmartGarage Assistant Mécanique</h2>
        <p>Parlez-moi de votre problème véhicule</p>
    </div>
    
    <div id="chat"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ex: Ma voiture diesel fait un bruit bizarre au démarrage..." />
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
    const sessionId = "user_" + Date.now(); //ici aprés réfrecher la page les données sera supprimée
    // Configuration ICI
    const rasaUrl = "http://localhost:5005";   

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";

        try {
            const res = await fetch(`${rasaUrl}/webhooks/rest/webhook`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                sender: sessionId,
                message: message
        })
            });

            const responses = await res.json();

            responses.forEach(response => {
                if (response.text) {
                    addMessage(response.text, "bot");
                }
            });
        } catch (err) {
            addMessage("❌ Impossible de contacter le serveur Rasa. Vérifiez qu'il est démarré sur le port 5005.", "bot");
            console.error(err);
        }
    }

    function addMessage(text, sender) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = `message ${sender}`;
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Send message with Enter key
    document.getElementById("userInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });

    // Welcome message
    window.onload = () => {
    document.getElementById("chat").innerHTML = "";

    addMessage(
        "Bonjour ! Je suis votre assistant mécanique. Décrivez votre panne ou votre question.",
        "bot"
    );
};
</script>

</body>
</html>
